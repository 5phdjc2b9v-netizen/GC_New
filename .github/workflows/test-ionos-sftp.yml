name: IONOS SFTP Verbindungstest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-ionos-sftp.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SFTP-Verbindung nur lesend testen
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USERNAME: ${{ secrets.SFTP_USERNAME }}
          PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          PORT: ${{ secrets.SFTP_PORT }}
        run: |
          python -m pip install --quiet paramiko
          python - <<'PY'
          import os
          import paramiko
          host = os.environ['HOST']
          username = os.environ['USERNAME']
          password = os.environ['PASSWORD']
          port = int(os.environ.get('PORT') or 22)
          if not all((host, username, password)):
              raise ValueError('Ein erforderliches SFTP-Secret fehlt')
          client = paramiko.SSHClient()
          client.load_system_host_keys()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          try:
              client.connect(host, port=port, username=username, password=password, timeout=15, auth_timeout=15, look_for_keys=False, allow_agent=False)
              sftp = client.open_sftp()
              print('SFTP-Anmeldung erfolgreich; aktueller Ordner:', sftp.normalize('.'))
              print('Verzeichnis lesbar:', len(sftp.listdir('.')), 'Eintraege')
              sftp.close()
          finally:
              client.close()
          PY
