name: Wix Blattschnitte sichern
on:
  push:
    branches: [relaunch-v1]
    paths:
      - 'scripts/export_wix_blattschnitte.py'
      - '.github/workflows/export-wix-blattschnitte.yml'
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/export_wix_blattschnitte.py
      - name: Commit mirrored Blattschnitte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads/blattschnitte assets/data/blattschnitte.json
          if git diff --cached --quiet; then
            echo "No Blattschnitt changes"
          else
            git commit -m "Mirror legacy Blattschnitt PDFs"
            git push origin HEAD:relaunch-v1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blattschnitte-wix-export
          path: blattschnitte-export/
          retention-days: 30
          if-no-files-found: warn
