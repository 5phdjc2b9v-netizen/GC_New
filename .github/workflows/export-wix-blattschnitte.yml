name: Wix Blattschnitte sichern
on:
  push:
    branches: [relaunch-v1]
    paths:
      - 'scripts/export_wix_blattschnitte.py'
      - '.github/workflows/export-wix-blattschnitte.yml'
  workflow_dispatch:
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/export_wix_blattschnitte.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blattschnitte-wix-export
          path: blattschnitte-export/
          retention-days: 30
          if-no-files-found: warn
