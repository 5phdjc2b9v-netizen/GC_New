name: Mirror World for Kids and Biber catalog PDFs

on:
  push:
    branches: [relaunch-v1]
    paths:
      - "tools/mirror_family_catalogs.py"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf pillow
      - name: Mirror PDFs and produce first-page covers
        run: python tools/mirror_family_catalogs.py
      - name: Commit publisher catalogs and HTML changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programm.html assets/catalogs/pdfs/world-for-kids-programm-2025.pdf assets/catalogs/pdfs/biber-butzemann-gesamtkatalog-2025.pdf assets/images/catalogs/world-for-kids-programm-2025.webp assets/images/catalogs/biber-butzemann-gesamtkatalog-2025.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Localize World for Kids and Biber catalogs with updated covers"
          git push origin HEAD:relaunch-v1
