name: Optimize large website images once
on:
  push:
    branches: [relaunch-v1]
    paths:
      - "tools/optimize_large_site_images.py"
      - ".github/workflows/optimize-large-images.yml"
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Optimize files and update references
        run: python tools/optimize_large_site_images.py
      - name: Commit smaller WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/ '*.html' assets/css assets/js
          if git diff --cached --quiet; then
            echo "No optimizations needed"
            exit 0
          fi
          git commit -m "Optimize eight oversized site images to WebP"
          git pull --rebase origin relaunch-v1
          git push origin HEAD:relaunch-v1
