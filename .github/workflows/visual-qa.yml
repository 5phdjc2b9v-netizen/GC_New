name: Visual QA screenshots

on:
  workflow_dispatch:
  push:
    branches: [relaunch-v1]
    paths:
      - "tools/visual_qa.mjs"
      - ".github/workflows/visual-qa.yml"

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install browser driver
        run: npm install playwright-core
      - name: Render pages
        run: node tools/visual_qa.mjs
      - name: Commit QA screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/screenshots qa/sections qa/report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add visual QA screenshots"
          git push origin HEAD:relaunch-v1
