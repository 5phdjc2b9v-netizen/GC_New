name: Generate 2027 publisher catalog covers

on:
  push:
    branches: [relaunch-v1]
    paths:
      - "tools/create_catalog_covers_2027.py"
      - ".github/workflows/generate-catalog-covers-2027.yml"
      - "assets/catalogs/pdfs/teneues-fruehjahr-2027.pdf"
      - "assets/catalogs/pdfs/gestalten-fruehjahr-2027.pdf"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF renderer and image optimizer
        run: python -m pip install pymupdf pillow

      - name: Generate catalog covers
        run: python tools/create_catalog_covers_2027.py

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/catalogs/teneues-fruehjahr-2027.webp assets/images/catalogs/gestalten-fruehjahr-2027.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate spring 2027 publisher catalog cover images"
          git push origin HEAD:relaunch-v1
