name: Localize Raethgloben image

on:
  push:
    branches: [relaunch-v1]
    paths:
      - ".github/workflows/localize-raethgloben.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0

      - name: Download lifestyle image
        run: |
          mkdir -p assets/images/portfolio
          curl -L --fail --retry 2 -A "Mozilla/5.0"             "https://www.raethgloben.de/images/product_images/popup_images/atmosphere/classic/full-circle-R-reliefglobus1.jpg"             -o assets/images/portfolio/raethgloben-full-circle-r.jpg

      - name: Use local image on homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old='src="https://www.raethgloben.de/de/images/product_images/popup_images/atmosphere/classic/full-circle-R-reliefglobus1.jpg"'
          old2='src="https://www.raethgloben.de/images/product_images/popup_images/atmosphere/classic/full-circle-R-reliefglobus1.jpg"'
          new='src="./assets/images/portfolio/raethgloben-full-circle-r.jpg"'
          s=s.replace(old,new).replace(old2,new)
          s=s.replace(' referrerpolicy="no-referrer"','')
          p.write_text(s)
          PY

      - name: Commit localized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/portfolio/raethgloben-full-circle-r.jpg index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Localize Raethgloben lifestyle image"
          git push origin HEAD:relaunch-v1
