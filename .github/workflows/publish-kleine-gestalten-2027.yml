name: Publish Kleine gestalten spring 2027

on:
  push:
    branches: [relaunch-v1]
    paths:
      - "assets/catalogs/pdfs/kleine-gestalten-fruehjahr-2027.pdf"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pymupdf pillow
      - run: python tools/publish_kleine_gestalten_2027.py
      - name: Commit updated catalog entry and cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programm.html assets/images/catalogs/kleine-gestalten-fruehjahr-2027.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Kleine gestalten catalog spring 2027"
          git push origin HEAD:relaunch-v1
