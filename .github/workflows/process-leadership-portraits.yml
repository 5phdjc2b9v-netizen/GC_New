name: Process leadership portraits

on:
  push:
    branches:
      - relaunch-v1
    paths:
      - "tools/process_portraits.py"
      - ".github/workflows/process-leadership-portraits.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relaunch branch
        uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0

      - name: Read final portraits from main
        run: |
          git fetch origin main
          git show "origin/main:Portraits Neu 10.11.2026/anja alexandra pfister.png" > /tmp/anja.png
          git show "origin/main:Portraits Neu 10.11.2026/klaus höhne.png" > /tmp/klaus.png

      - name: Copy final portraits and update page
        run: python tools/process_portraits.py

      - name: Commit final portrait assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/team/ unternehmen.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use final matched leadership portraits"
          git push origin HEAD:relaunch-v1
