name: Process leadership portraits

on:
  push:
    branches:
      - relaunch-v1
    paths:
      - "tools/process_portraits.py"
      - ".github/workflows/process-leadership-portraits.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout relaunch branch
        uses: actions/checkout@v4
        with:
          ref: relaunch-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "rembg[cpu]" pillow

      - name: Read original portraits from main
        run: |
          git fetch origin main
          git show origin/main:IMG_5727.JPG > /tmp/anja.jpg
          git show origin/main:PHOTO-2026-10-17-00-04-16.jpg > /tmp/klaus.jpg

      - name: Process portraits and update page
        run: python tools/process_portraits.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/team/ unternehmen.html assets/css/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use cut-out leadership portraits"
          git push origin HEAD:relaunch-v1
